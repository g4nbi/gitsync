name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create Xcode project if needed (manual setup assumed)
        run: |
          echo "This workflow expects a full Xcode project already present."
          echo "If you only have the source folder, create the project in Xcode first then push."
          ls -la

      - name: Build (unsigned)
        run: |
          # Adjust scheme / project name if different
          xcodebuild \
            -project Gitsync.xcodeproj \
            -scheme Gitsync \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/Gitsync.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive || true

          # Fallback for pure source (user must open in Xcode once)
          if [ ! -d build/Gitsync.xcarchive ]; then
            echo "No archive produced. Please create Gitsync.xcodeproj in Xcode and re-run."
            exit 0
          fi

      - name: Export IPA (unsigned)
        run: |
          mkdir -p Payload
          if [ -d build/Gitsync.xcarchive/Products/Applications ]; then
            cp -r build/Gitsync.xcarchive/Products/Applications/*.app Payload/
            zip -r Gitsync-unsigned.ipa Payload
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gitsync-unsigned-ipa
          path: Gitsync-unsigned.ipa
          if-no-files-found: ignore
